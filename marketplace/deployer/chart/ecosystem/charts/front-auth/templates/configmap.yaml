{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: front-auth-config
  labels:
    app.kubernetes.io/name: front-auth
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: authentication-frontend
data:
{{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
