{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: asm-plus-api-config
  labels:
    app.kubernetes.io/name: api-asm-plus
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: document-management-api
data:
{{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
