{{- if .Values.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName | default "asm-api" }}
  labels:
    app.kubernetes.io/name: asm-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: storage-api
  {{- with .Values.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
