{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-sf-config
  labels:
    app.kubernetes.io/name: api-sf
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: successfactors-api
data:
{{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
