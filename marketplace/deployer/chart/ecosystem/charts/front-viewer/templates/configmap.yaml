{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: front-viewer-config
  labels:
    app.kubernetes.io/name: front-viewer
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: document-viewer
data:
{{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
