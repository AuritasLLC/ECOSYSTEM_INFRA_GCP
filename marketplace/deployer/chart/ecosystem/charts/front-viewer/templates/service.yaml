{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: front-viewer
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default":"front-viewer-backend"}'
  labels:
    app.kubernetes.io/name: front-viewer
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: document-viewer
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: front-viewer
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.port | default 8080 }}
      targetPort: http
{{- end }}
