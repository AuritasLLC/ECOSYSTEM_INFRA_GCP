{{- if and .Values.global.ingress.enabled .Values.global.ingress.frontendConfigName }}
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: {{ .Values.global.ingress.frontendConfigName }}
  labels:
    app.kubernetes.io/name: asm-plus
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  redirectToHttps:
    enabled: true
    responseCodeName: PERMANENT_REDIRECT
{{- end }}
